name: test-cpu

# The CPU-safe core (core/, export/, deploy/triton/config_generator, report/)
# is developed on macOS-arm64 where CUDA and TensorRT do not exist. This
# workflow is the primary gate and must stay green on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch only — no CUDA wheels on runners)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[export,dev]"
      - name: Unit tests
        run: pytest tests/unit -v --cov --cov-report=term-missing
